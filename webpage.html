<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080507">
  <title>Kitt's Lounge | Under Maintenance</title>
  <link rel="icon" href="https://raw.githubusercontent.com/kzzlolz/kitts-lounge/main/ce5aa4756897f37aaafe68c52850b4f9.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080507;
      --panel: rgba(18, 10, 15, .92);
      --blood: #4a1222;
      --crimson: #8a2542;
      --bright: #ff4d6d;
      --rose: #d4a5b2;
      --gold: #c2ab88;
      --paper: #f0e6eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 50% 42%, rgba(74,18,34,.34), transparent 58%),
        var(--bg);
      font-family: Inter, sans-serif;
    }
    .maintenance {
      width: min(620px, 100%);
      padding: clamp(28px, 6vw, 54px);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--gold);
      box-shadow: 8px 8px 0 rgba(0,0,0,.55);
      animation: rise .8s ease both;
    }
    .logo {
      width: 88px; height: 88px; object-fit: cover;
      border: 2px solid var(--gold);
      box-shadow: 4px 4px 0 var(--blood);
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite alternate;
    }
    .eyebrow {
      color: var(--rose);
      font: .58rem/1.8 'Press Start 2P', monospace;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }
    h1 {
      font: 600 clamp(2.5rem, 8vw, 4.3rem)/1 'Cormorant Garamond', serif;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 var(--blood), 0 0 24px rgba(255,77,109,.2);
      margin-bottom: 22px;
    }
    .message {
      color: var(--rose);
      font-size: .96rem;
      line-height: 1.9;
      max-width: 440px;
      margin: 0 auto 28px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(196,166,176,.25);
      background: rgba(30,14,22,.8);
      padding: 12px 16px;
      color: var(--paper);
      font: .55rem/1.8 'Press Start 2P', monospace;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--bright);
      box-shadow: 0 0 9px var(--bright);
      animation: blink 1.2s infinite;
    }
    .footer {
      color: rgba(212,165,178,.65);
      margin-top: 30px;
      font-size: .75rem;
      letter-spacing: .4px;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { to { transform: scale(1.05); } }
    @keyframes blink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="maintenance" aria-labelledby="maintenance-title">
    <img class="logo" src="https://raw.githubusercontent.com/kzzlolz/kitts-lounge/main/ce5aa4756897f37aaafe68c52850b4f9.jpg" alt="Kitt's Lounge logo">
    <p class="eyebrow">✦ KITT'S LOUNGE ✦</p>
    <h1 id="maintenance-title">Under<br>Maintenance</h1>
    <p class="message">
      The lounge is taking a little time behind the scenes.
      We're working on updates to make your next visit even better.
      Please check back soon. Thank you for your patience ♡
    </p>
    <div class="status"><span class="dot" aria-hidden="true"></span> MAINTENANCE IN PROGRESS</div>
    <p class="footer">「 A little pause before the next chapter 」</p>
  </main>
</body>
</html>
